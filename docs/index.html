<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Online</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#111827}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1d4ed8,#0f172a)}
    .card{width:100%;max-width:520px;background:white;border-radius:18px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
    h1{margin:0 0 8px}
    p{line-height:1.5}
    a.button{display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:bold}
    code{background:#f1f5f9;padding:2px 5px;border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Kasir Online</h1>
      <p>Halaman GitHub Pages ini adalah pintu masuk ke Web App Google Apps Script.</p>
      <p id="msg">URL Web App belum diisi.</p>
      <p><a id="openBtn" class="button" href="#">Buka Aplikasi Kasir</a></p>
      <hr>
      <p><b>Catatan:</b> aplikasi utama tetap harus dijalankan dari Google Apps Script karena memakai <code>google.script.run</code>.</p>
    </div>
  </div>

  <script>
    // GANTI dengan URL Web App Apps Script kamu, contoh:
    // https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxxxx/exec
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby8Q8Ho365eGCACUN6-yBA7hWuoKPXbDEugtswos1JX-dyfFyZY4yo49Emv4xffWvjM6g/exec";

    const msg = document.getElementById("msg");
    const btn = document.getElementById("openBtn");

    if (WEB_APP_URL && !WEB_APP_URL.includes("GANTI_DENGAN")) {
      msg.textContent = "Klik tombol di bawah untuk membuka aplikasi.";
      btn.href = WEB_APP_URL;
      // Aktifkan baris ini kalau mau otomatis redirect:
      // window.location.href = WEB_APP_URL;
    } else {
      btn.style.display = "none";
      msg.innerHTML = "Edit file <code>docs/index.html</code>, lalu isi <code>WEB_APP_URL</code> dengan URL deployment Apps Script.";
    }
  </script>
</body>
</html>
