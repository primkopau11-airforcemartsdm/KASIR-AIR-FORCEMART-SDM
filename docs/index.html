<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Online</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: white;
    }

    #setupBox {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #1d4ed8, #0f172a);
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }

    code {
      background: #f1f5f9;
      padding: 2px 5px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="setupBox">
    <div class="card">
      <h1>Kasir Online</h1>
      <p>Link luar Script App sudah siap.</p>
      <p>Edit file <b>docs/index.html</b>, lalu ganti bagian:</p>
      <p><code>https://script.google.com/macros/s/AKfycby8Q8Ho365eGCACUN6-yBA7hWuoKPXbDEugtswos1JX-dyfFyZY4yo49Emv4xffWvjM6g/exec</code></p>
      <p>dengan URL Web App Apps Script kamu yang berakhiran <code>/exec</code>.</p>
    </div>
  </div>

  <iframe id="appFrame" style="display:none" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    // ISI DENGAN LINK WEB APP APPS SCRIPT KAMU.
    // Contoh:
    // const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxxxx/exec";

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby8Q8Ho365eGCACUN6-yBA7hWuoKPXbDEugtswos1JX-dyfFyZY4yo49Emv4xffWvjM6g/exec";

    if (WEB_APP_URL && !WEB_APP_URL.includes("GANTI_DENGAN")) {
      document.getElementById("setupBox").style.display = "none";
      const frame = document.getElementById("appFrame");
      frame.src = WEB_APP_URL;
      frame.style.display = "block";
    }
  </script>
</body>
</html>
